<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EECU-CheckBook-App</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_drop_down" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@latest/dist/chart.umd.min.js"></script>
</head>
<body>
    <section id="side-nav">
        <div id="eecu-logo">
            <img src="Imgs/logo 1.svg" alt="EECU-Logo">
        </div>
        <a href="index.html" class="home-link">Profile</a>
        <p id="dise">...</p>

        <div id="side-container">
            <span id="sidenav-options">
                <a class="sidenav-btns" href="#">Budgeting</a>
                <a class="sidenav-btns" href="index.html">Accounts</a>  
            </span>
        </div>
        <div class="drop">
            <button class="drop-btns"><img src="Imgs/drop-arrow.png" alt="Dropdown Arrow">Budget</button>
            <button class="drop-btns"><img src="Imgs/drop-arrow.png" alt="Dropdown Arrow">Loans</button>
            <button class="drop-btns"><img src="Imgs/drop-arrow.png" alt="Dropdown Arrow">Tracking</button>
        </div>
    </section>
<section>
    <div id="container">

        <section id="top-section-1">
            <span class="btn-align">
            <label>Prev.</label>
            <button>
                <img src="imgs/Back.png" alt="Back-Arrow" id="backBtn">
            </button>
            </span>
                <p id="month-text">February</p> <!--Javascript I assume-->
                <label>Next</label>
            <button>
                <img src="imgs/Back.png" alt="Back-Arrow" id="forwardBtn">
            </button>
        </section>

        <section id="top-section-2">
            <span class="btn-align">
            <button id="assign">Reset<img src="Imgs/drop-arrow.png"/></button>
            </span>
            <h2 id="monmon"><span id="days">$</span> </h2>
            <h3>Budget</h3>
        </section>
    </div>
    
    <section id="chart-and-data">
        <div id="chart-conatiner">
            <!--Placeholder-->
        </div>
         <div id="budget-data">
            <table id="assign-output">
                <tr>
                    <th>Category</th>
                    <th>Budgeted</th>
                    <th>Activity</th>
                    <th>Available</th>
                </tr>
    
                <tr>
                    <td>Bills <img src="imgs/drop-arrow.png" alt="Bills Arrow"></td>
                    <span id="nmbrs">
                        <td>$0.00</td>
                        <td>$0.00</td>
                        <td id="monthlyBudget">$0.00</td>
                    </span>
                </tr>
            </table>

            <!--Edit Category names and expense names based off sections in project brief-->
            <div>
                <input id="billy" placeholder="Insert bill type"></input>
                <input id="actualBill" placeholder="and bill value"></input>
                <button id="openCategory" src="Imgs/round.png"></button>
            </div>

         </div>
    </section>
</section>
    <section id="manage">
    <!--All bills go here-->
    </section> 

    <button id="but">Calculate</button>

            <canvas id="chartCanvas" height="873" width="873" style="display: block; box-sizing: border-box; height: 698.4px; width: 698.4px;"></canvas>

    <script src="expense.js"></script>
    <script src="pie.js"></script>
</body>
</html>
